<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: local("Bricolage Grotesque");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(120% 140% at 8% -10%, #182036 0%, #0c0d11 46%), #0c0d11;
        font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(80% 90% at 30% 30%, #000 30%, transparent 78%);
      }
      .wrap {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 78px 84px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand svg {
        width: 46px;
        height: 46px;
        color: #6aa6ff;
      }
      .brand span {
        font-family:
          "Bricolage Grotesque",
          -apple-system,
          sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.03em;
        color: #f3f4f8;
      }
      h1 {
        margin-top: 64px;
        font-family:
          "Bricolage Grotesque",
          -apple-system,
          sans-serif;
        font-weight: 800;
        font-size: 56px;
        line-height: 1.04;
        letter-spacing: -0.03em;
        color: #f3f4f8;
        max-width: 540px;
      }
      p {
        margin-top: 26px;
        font-size: 22px;
        line-height: 1.55;
        color: #9498a8;
        max-width: 470px;
      }
      /* The README's screenshot, run off the corner so it reads as the window, not a picture of it. */
      .shot {
        position: absolute;
        left: 640px;
        top: 150px;
        width: 760px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="brand">
        <svg viewBox="283 283 458 458" fill="none" stroke="currentColor">
          <path d="M386 386 Q430 606 638 638" stroke-width="30" stroke-linecap="round" />
          <g stroke-width="42">
            <circle cx="386" cy="386" r="74" />
            <circle cx="638" cy="386" r="74" />
            <circle cx="386" cy="638" r="74" />
            <circle cx="638" cy="638" r="74" />
          </g>
          <g fill="currentColor" stroke="none">
            <circle cx="386" cy="386" r="30" />
            <circle cx="638" cy="638" r="30" />
          </g>
        </svg>
        <span>patchbay</span>
      </div>
      <h1>Share the list,<br />not the passwords.</h1>
      <p>
        One TOML file on the team drive, and the window that opens it. The keys stay in your ssh
        agent.
      </p>
      <img class="shot" src="../assets/screenshot-dark.png" alt="" />
    </div>
  </body>
</html>
