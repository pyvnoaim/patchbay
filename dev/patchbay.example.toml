# Sample config for `npm run dev` - never touches your real one.
# `local` actually connects if you have an sshd running (macOS: Settings →
# General → Sharing → Remote Login). The rest exercise the tree and the route pane.
#
# A folder with slashes nests in the sidebar: "prod/eu/web" is prod → eu → web.
# `folders` is a list, so a jack can sit in more than one branch.

[defaults]
user = "root"

[jack.local]
os = "macos"
host = "localhost"
user = "me"                      # change to your own account; [defaults] root won't work here
desc = "your own box, if Remote Login is on"

[jack.bastion]
os = "debian"
host = "bastion.example"
port = 2222
desc = "the way in"

[jack.web]
os = "ubuntu"
host = "10.0.0.4"
user = "deploy"
key = "~/.ssh/prod"
jump = "bastion"
forward = ["8080:localhost:80"]
desc = "two hops: bastion, then here"

[jack.db]
os = "postgres"
host = "10.0.0.5"
jump = "web"
forward = ["5432:localhost:5432"]
desc = "three hops - check the route pane's order"

[jack.web-us]
os = "ubuntu"
host = "10.1.0.4"
user = "deploy"

[jack.db-us]
os = "postgres"
host = "10.1.0.5"

[jack.staging-web]
os = "alpine"
host = "10.2.0.4"
user = "deploy"

[jack.scratch]
os = "synology"
host = "10.9.9.9"
desc = "no folders - only shows under All jacks"

[jack.nas]
host = "10.0.0.20"
os = "synology"
url = "https://10.0.0.20:5001"   # DSM, opens in your browser
primary = "web"                  # ssh is there too, but DSM is what you usually want
mac = "00:1b:21:92:0a:1f"        # gives the detail pane a Wake button
desc = "DS920+"

[jack.hypervisor]
host = "10.0.0.30"
os = "proxmox"
url = "https://10.0.0.30:8006"

[jack.gateway]
host = "10.0.0.1"
os = "opnsense"
ssh = false                      # web UI only - no Connect button, no ssh fields
url = "https://10.0.0.1"

[jack.pi]
host = "10.0.0.40"
os = "raspberrypi"

[jack.windows]
host = "1.1.1.1"
os = "windows"

# ── customers ──────────────────────────────────────────────────────────────
# One folder per customer, so a whole engagement is one row in the sidebar.

# What the folder lends: every device in it that doesn't say otherwise is reached
# this way, so the bastion and the account are written once instead of per device.
[folder.acme]
jump = "bastion"
user = "deploy"
note = "their bastion, not ours - tickets first"

[jack.acme-app]
host = "10.80.0.10"
os   = "debian"
folders = ["acme"]

[jack.acme-db]
host = "10.80.0.11"
os   = "postgres"
folders = ["acme"]

[jack.acme-dc]
host = "10.80.0.50"
user = "administrator"           # its own account wins over the folder's
os   = "windows"
rdp  = 3389                      # RDP has no ProxyJump, so patchbay forwards a port
folders = ["acme"]
desc = "reached through the folder's bastion - check the Tunnel row after clicking RDP"

[jack.Testo]
host = "192.168.1.26"
user = "Acme"
os = "Windows"
folders = ["Büro"]
ssh = false
rdp = 3389
