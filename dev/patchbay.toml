# Sample config for `npm run dev` — never touches your real one.
# `local` actually connects if you have an sshd running (macOS: Settings →
# General → Sharing → Remote Login). The rest exercise the tree and the route pane.
#
# A tag with slashes nests in the sidebar: "prod/eu/web" is prod → eu → web.
# A jack can sit in more than one branch — that's the point of tags over folders.

[defaults]
user = "root"

[jack.local]
os = "macos"
host = "localhost"
user = "you"          # your own account — [defaults] root won't work here
tags = ["dev"]
desc = "your own box, if Remote Login is on"

[jack.bastion]
os = "debian"
host = "bastion.example"
port = 2222
tags = ["prod/eu", "entrypoint"]
desc = "the way in"

[jack.web]
os = "ubuntu"
host = "10.0.0.4"
user = "deploy"
key = "~/.ssh/prod"
jump = "bastion"
forward = ["8080:localhost:80"]
tags = ["prod/eu/web", "customer-facing"]
desc = "two hops: bastion, then here"

[jack.db]
os = "postgres"
host = "10.0.0.5"
jump = "web"
forward = ["5432:localhost:5432"]
tags = ["prod/eu/db"]
desc = "three hops — check the route pane's order"

[jack.web-us]
os = "ubuntu"
host = "10.1.0.4"
user = "deploy"
tags = ["prod/us/web", "customer-facing"]

[jack.db-us]
os = "postgres"
host = "10.1.0.5"
tags = ["prod/us/db"]

[jack.staging-web]
os = "alpine"
host = "10.2.0.4"
user = "deploy"
tags = ["staging/web"]

[jack.scratch]
os = "synology"
host = "10.9.9.9"
desc = "no tags — lands under Untagged"

[jack.nas]
host = "10.0.0.20"
os = "synology"
url = "https://10.0.0.20:5001"   # DSM, opens in your browser
tags = ["home"]
desc = "DS920+"

[jack.hypervisor]
host = "10.0.0.30"
os = "proxmox"
url = "https://10.0.0.30:8006"
tags = ["home"]

[jack.gateway]
host = "10.0.0.1"
os = "opnsense"
url = "https://10.0.0.1"
tags = ["home"]

[jack.pi]
host = "10.0.0.40"
os = "raspberrypi"
tags = ["home"]

[jack.windows]
host = "1.1.1.1"
os = "windows"

# ── customers ──────────────────────────────────────────────────────────────
# One folder per customer; the VPN switch appears on the folder that a
# [vpn."<folder>"] section names. `check` is optional — without it the switch
# shows what patchbay last did, not what is actually up.
# The commands must RETURN — patchbay waits for them, then reads the exit code.
# A bare `openvpn --config x.ovpn` stays in the foreground and is killed after 45s;
# drive a VPN app or a service manager instead. Examples that work:
#
#   Tailscale — no root needed, the daemon already has it
#     up    = "tailscale up"
#     down  = "tailscale down"
#     check = "tailscale status --peer=false"
#
#   OpenVPN via Tunnelblick (macOS) — it exposes connect/disconnect/state
#     up    = "osascript -e 'tell app \"Tunnelblick\" to connect \"acme\"'"
#     down  = "osascript -e 'tell app \"Tunnelblick\" to disconnect \"acme\"'"
#     check = "osascript -e 'tell app \"Tunnelblick\" to get state of first configuration whose name is \"acme\"' | grep -q CONNECTED"
#
#   WireGuard — needs root, so let macOS raise its own auth dialog
#     up    = "osascript -e 'do shell script \"wg-quick up acme\" with administrator privileges'"
#     check = "wg show acme"
#
#   WiFiman / UniFi Teleport is GUI-only — no CLI to drive, so no switch for it.
[vpn.acme]
up    = "echo bringing acme up"
down  = "echo taking acme down"
check = "false"

[jack.acme-app]
host = "10.80.0.10"
user = "deploy"
os   = "debian"
tags = ["acme/prod"]

[jack.acme-db]
host = "10.80.0.11"
os   = "postgres"
tags = ["acme/prod"]
