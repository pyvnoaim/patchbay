[package]
name = "patchbay-app"
version = "0.1.64"
edition = "2021"
license-file = "../LICENSE"   # our own terms, not an SPDX id
rust-version = "1.94"   # ironrdp main (in-app RDP) needs it
description = "Every host, one jack away."
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what `Window::add_child` needs, and a child webview is the only way to
# put a device's web UI in a *tab* rather than a window of its own: an iframe is what
# X-Frame-Options blocks, and DSM, OPNsense and Proxmox all send it. The cost is a
# feature Tauri may change in a minor release - check the web tab after a bump.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order keeps jacks in the order they appear in the file, like `bay ls` does.
toml = { version = "0.8", features = ["preserve_order"] }
# Writes go through toml_edit, not a re-serialize - it keeps the user's comments,
# spacing and key order intact. The config is a file people hand-edit.
toml_edit = "0.22"
# A real PTY, so ssh gets a tty - password prompts and full-screen programs work.
portable-pty = "0.9"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
# IronRDP from git: the graphics pipeline (H.264, the client compositor) is on its main
# branch and not yet released. The fork is that main plus two speedups sent upstream as
# Devolutions/IronRDP#2216 and #2217.
# ponytail: a pinned fork; back to Devolutions' repo once both merge, and to crates.io
# once a release carries the graphics pipeline.
ironrdp = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf", features = ["connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol"] }
ironrdp-blocking = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
ironrdp-pdu = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
ironrdp-graphics = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
rustls = "0.23.43"
tokio-rustls = "0.26.4"
sspi = { version = "0.23", features = ["network_client"] }
x509-cert = "0.2"
ironrdp-input = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
ironrdp-cliprdr = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
arboard = "3.6.1"
# "Edit here" learns of a save from the OS (FSEvents, inotify, ReadDirectoryChangesW)
# rather than a thread per open file stat-ing it every two seconds.
notify = "8"
ironrdp-core = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
ironrdp-egfx = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
ironrdp-rdpsnd = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
sha2 = "0.11.0"
# The team licence, checked offline against the public key in licence.rs. Already in
# the tree behind the updater; taking it directly keeps the licence off the network.
minisign-verify = "0.2"
# VNC in a tab: pure Rust, async on a runtime of the session's own (`vnc_session.rs`).
vnc-rs = "0.6"
tokio = { version = "1", features = ["rt", "net", "time"] }
# Channel payloads are handed to the webview as text; see `channel_js` in main.rs.
base64 = "0.22"
# Royal TS documents. A `.rtsz` is XML, not a zip - and the names in a real one have
# `&amp;` in them, which is exactly the thing a hand-rolled reader gets wrong.
quick-xml = "0.37"
# The web-UI preflight and the update check. Blocking, because both already run on a
# spawn_blocking thread. rustls rather than native-tls to keep the build free of an
# openssl dependency; it is already here for RDP.
#
# *native-roots*, not the bundled Mozilla set: the preflight exists to predict whether
# the webview can load a page, and the webview trusts the OS store. With webpki-roots
# we'd reject a certificate the user had already added to their Keychain and send them
# to the browser for a page that would have opened fine.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

# Self-update, verified against the minisign public key in tauri.conf.json. Default
# features only: they are rustls, so the build stays free of an openssl dependency.
tauri-plugin-updater = "2"

# `patchbay://web-01` on every desktop. The bundler registers the scheme where each
# OS wants it (Info.plist, the installer's registry keys, the .desktop file); on
# Windows and Linux the link arrives as argv of a *second* process, which is what
# single-instance is for - it hands the argv to the copy already running.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# The file picker behind Settings > Team. Driven from Rust, like deep-link, so the
# window needs no capability for it - and an OS panel is the one way to name a path
# that is certainly there, on a share whose spelling nobody remembers.
tauri-plugin-dialog = "2"

# A ticked "Remember" on the RDP sign-in: the OS keychain holds it, never a file of ours.
# Each OS its own store; Linux's Secret Service over zbus, which is pure Rust.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
window-vibrancy = "0.5"
# The change counter behind `clipboard::stamp()`: one integer per poll tick instead of
# reading the clipboard's text. Already in the tree through arboard; only the feature is new.
objc2-app-kit = { version = "0.3", features = ["NSHapticFeedback", "NSPasteboard", "NSPopover", "NSResponder", "NSView", "NSWindow"] }
# WKWebExtension, for hosting Bitwarden's own extension over the web tabs. Both objc2
# generations are already here - 0.5 under arboard, 0.6 under wry - so this pulls in
# no version that wasn't being built anyway.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSSet", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKWebExtension",
    "WKWebExtensionAction",
    "WKWebExtensionCommand",
    "WKWebExtensionContext",
    "WKWebExtensionController",
    "WKWebExtensionControllerConfiguration",
    "WKWebExtensionControllerDelegate",
    "WKWebExtensionMatchPattern",
    "WKWebExtensionPermission",
    "WKWebExtensionTab",
    "WKWebExtensionWindow",
    "WKWebView",
    "WKWebViewConfiguration",
    "block2",
    "objc2-app-kit",
] }
# H.264 for the remote desktop's graphics pipeline, decoded by the Mac's own hardware
# decoder: the codec licence is the OS's, and no C library is linked.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTBase", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "objc2-core-media", "objc2-core-video", "block2"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# The same, through Media Foundation's decoder; IronRDP's own, kept beside its graphics
# pipeline.
ironrdp-egfx-native = { git = "https://github.com/pyvnoaim/IronRDP", rev = "a7a793af9a2294513e2747536dc0039ee489e7cf" }
# Same counter, Windows' one. Already in the tree through tauri.
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_DataExchange",
] }

[lints.clippy]
# A command's parameters are its IPC contract with the window; a struct would only
# move the list.
too_many_arguments = "allow"

[profile.release]
opt-level = "s"
# ponytail: thin, not fat, and parallel codegen - a fat single-unit link redoes the
# whole program every release even on a warm cache, and CI has five minutes. Fat and
# one unit shave the binary a little further if size ever matters more than that.
lto = "thin"
strip = true
panic = "abort"

# Every RDP pixel goes through these, and "s" roughly halves the decode rate. Debug
# too, or `npm run dev` judges the session by an unoptimized codec.
[profile.release.package.ironrdp-graphics]
opt-level = 3
[profile.release.package.ironrdp-session]
opt-level = 3
[profile.release.package.ironrdp-egfx]
opt-level = 3
[profile.dev.package.ironrdp-graphics]
opt-level = 3
[profile.dev.package.ironrdp-session]
opt-level = 3
[profile.dev.package.ironrdp-egfx]
opt-level = 3
