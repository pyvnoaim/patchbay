[package]
name = "patchbay-app"
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"   # ironrdp 0.17 (in-app RDP) needs it
description = "Every host, one jack away."
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what `Window::add_child` needs, and a child webview is the only way to
# put a device's web UI in a *tab* rather than a window of its own: an iframe is what
# X-Frame-Options blocks, and DSM, OPNsense and Proxmox all send it. The cost is a
# feature Tauri may change in a minor release - check the web tab after a bump.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order keeps jacks in the order they appear in the file, like `bay ls` does.
toml = { version = "0.8", features = ["preserve_order"] }
# Writes go through toml_edit, not a re-serialize - it keeps the user's comments,
# spacing and key order intact. The config is a file people hand-edit.
toml_edit = "0.22"
# A real PTY, so ssh gets a tty - password prompts and full-screen programs work.
portable-pty = "0.9"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "svc", "dvc"] }
ironrdp-blocking = "0.10.0"
ironrdp-pdu = "0.9.0"
ironrdp-graphics = "0.9.0"
rustls = "0.23.43"
tokio-rustls = "0.26.4"
sspi = { version = "0.21.3", features = ["network_client"] }
x509-cert = "0.2"
ironrdp-input = "0.7.0"
ironrdp-cliprdr = "0.7.0"
arboard = "3.6.1"
ironrdp-core = "0.2.1"
sha2 = "0.11.0"
# Royal TS documents. A `.rtsz` is XML, not a zip - and the names in a real one have
# `&amp;` in them, which is exactly the thing a hand-rolled reader gets wrong.
quick-xml = "0.37"
# The web-UI preflight and the update check. Blocking, because both already run on a
# spawn_blocking thread. rustls rather than native-tls to keep the build free of an
# openssl dependency; it is already here for RDP.
#
# *native-roots*, not the bundled Mozilla set: the preflight exists to predict whether
# the webview can load a page, and the webview trusts the OS store. With webpki-roots
# we'd reject a certificate the user had already added to their Keychain and send them
# to the browser for a page that would have opened fine.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

# Self-update, verified against the minisign public key in tauri.conf.json. Default
# features only: they are rustls, so the build stays free of an openssl dependency.
tauri-plugin-updater = "2"

# Where the window was last time. Ours would be four numbers and a debounce until the
# monitor it was on goes away - this one already clamps a restored position back onto
# a screen that still exists.
tauri-plugin-window-state = "2"

# `patchbay://web-01` on every desktop. The bundler registers the scheme where each
# OS wants it (Info.plist, the installer's registry keys, the .desktop file); on
# Windows and Linux the link arrives as argv of a *second* process, which is what
# single-instance is for - it hands the argv to the copy already running.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

[lints.clippy]
# A command's parameters are its IPC contract with the window; a struct would only
# move the list.
too_many_arguments = "allow"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
