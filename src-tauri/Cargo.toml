[package]
name = "patchbay-app"
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"   # ironrdp 0.17 (in-app RDP) needs it
description = "Every host, one jack away."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order keeps jacks in the order they appear in the file, like `bay ls` does.
toml = { version = "0.8", features = ["preserve_order"] }
# Writes go through toml_edit, not a re-serialize — it keeps the user's comments,
# spacing and key order intact. The config is a file people hand-edit.
toml_edit = "0.22"
# A real PTY, so ssh gets a tty — password prompts and full-screen programs work.
portable-pty = "0.9"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "svc", "dvc"] }
ironrdp-blocking = "0.10.0"
ironrdp-pdu = "0.9.0"
ironrdp-graphics = "0.9.0"
rustls = "0.23.43"
tokio-rustls = "0.26.4"
sspi = { version = "0.21.3", features = ["network_client"] }
x509-cert = "0.2"
ironrdp-input = "0.7.0"
ironrdp-cliprdr = "0.7.0"
arboard = "3.6.1"
ironrdp-core = "0.2.1"
sha2 = "0.11.0"
# The team server, and nothing else — blocking, because every call to it already
# runs on a spawn_blocking thread. rustls rather than native-tls to keep the build
# free of an openssl dependency; it is already here for RDP.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
