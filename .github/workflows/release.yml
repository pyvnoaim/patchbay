# A tag is the whole trigger: `npm run bump 0.1.0`, commit, `git tag v0.1.0`, push.
# The builds land in a *draft* release, because publishing it is also the moment every
# installed copy starts offering the update - that click stays yours.
#
# Unsigned until the Apple and Windows certificates exist: the secrets are already
# wired below, so adding them is a repository setting and not a change here.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  # Ten minutes into four runners is a bad time to find out the tag and the config
  # disagree - and the version in the bundle is the one the updater compares.
  version:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          tagged="${GITHUB_REF_NAME#v}"
          in_config=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tagged" != "$in_config" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, tauri.conf.json says $in_config" >&2
            echo "run: npm run bump $tagged" >&2
            exit 1
          fi
      # CHANGELOG.md is the source: this section becomes the release body, which
      # becomes the notes in latest.json, which is what the app shows before it
      # installs anything. Written once, read in three places.
      - id: notes
        run: node scripts/notes.mjs "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, args: --target aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin, args: --target x86_64-apple-darwin }
          - { os: windows-latest, target: "", args: "" }
          - { os: ubuntu-22.04, target: "", args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Everything tauri links against on Linux. The webview is the system's here.
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # Third-party actions are pinned to a commit, not a tag: this job hands them
      # the key that signs every update, and a tag can be moved onto new code by
      # whoever owns the action. Bump these deliberately.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-09-02
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 as of 2026-09-02
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # What the updater verifies against the public key in tauri.conf.json.
          # Without it the bundles still build; latest.json just can't be signed,
          # and nothing will accept an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Empty until the certificates exist, which is a plain unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: patchbay ${{ github.ref_name }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: true
          prerelease: false
          # The manifest the app fetches. Each runner merges its platform into the
          # one already on the release, so the matrix ends with a single latest.json.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
