# The point of this file is one thing: patchbay.ts and patchbay.rs are the same
# logic twice, and nothing but running both suites catches them drifting apart.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tauri links against the system webview even for `cargo test`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            server
      - run: npm ci
      - run: npm test
