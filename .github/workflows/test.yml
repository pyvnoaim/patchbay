# The app and the team server, both cargo test. Node is here for scripts/dev.mjs,
# which is what puts cargo on PATH and points the tests at a scratch config.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tauri links against the system webview even for `cargo test`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            server
      - run: npm ci
      - run: npm test
